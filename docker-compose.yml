version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: m183-todo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: secure_todo_password
      POSTGRES_DB: secure_todo_app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
